<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}班編成ツール{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" data-menu-button>
      <span></span><span></span><span></span>
    </button>
    <a class="site-title" href="{{ url_for('web.index') }}">班編成ツール</a>
  </header>

  <nav class="side-menu" aria-label="メインメニュー" data-menu hidden>
    <div class="side-menu__header">
      <strong>メニュー</strong>
      <button type="button" class="plain-button" aria-label="メニューを閉じる" data-menu-close>閉じる</button>
    </div>
    <a href="{{ url_for('web.history') }}">チーム構成履歴</a>
    <a href="{{ url_for('web.members') }}">会員リスト</a>
    <a href="{{ url_for('web.interview') }}">会員インタビューフォーム</a>
    <a href="{{ url_for('web.api_key') }}">APIキー入力</a>
  </nav>
  <div class="menu-backdrop" data-menu-backdrop hidden></div>

  <main class="page-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <section class="flash-list" aria-label="お知らせ">
          {% for category, message in messages %}
            <p class="flash flash--{{ category }}">{{ message }}</p>
          {% endfor %}
        </section>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
